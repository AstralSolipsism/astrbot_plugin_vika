[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vika-mcp"
version = "0.1.0"
description = "Universal MCP-style Vika service backed by the astral_vika SDK."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "astral-vika>=1.1.3,<2.0.0",
    "aiohttp>=3.8.0,<4.0.0",
    "anyio>=3.7.1,<4.0.0",
    "fastapi>=0.100.0",
    "httpx>=0.23.0",
    "pydantic>=2.0.0,<3.0.0",
    "PyYAML>=6.0",
    "uvicorn>=0.20.0",
]

[project.scripts]
vika-mcp = "vika_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/AstralSolipsism/astrbot_plugin_vika"
Repository = "https://github.com/AstralSolipsism/astrbot_plugin_vika"
Issues = "https://github.com/AstralSolipsism/astrbot_plugin_vika/issues"

[tool.setuptools]
packages = [
    "vika_mcp",
    "vika_mcp.mcp",
    "vika_mcp.tools",
]

[tool.setuptools.package-dir]
"vika_mcp" = "."
